name: PDF viewer fork checks

on:
  push:
    branches:
      [
        feature/pdf-viewer,
        feature/pdf-remote-packaging,
        feature/pdf-remote-files,
        feature/binary-viewer,
        feature/viewer-ui-hex-edit,
        feature/cli-current-directory,
        fix/pdf-scroll-terminal-projects,
        main,
      ]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: pdf-viewer-${{ github.ref }}
  cancel-in-progress: false

env:
  RUSTUP_TOOLCHAIN: 1.98.1
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always

jobs:
  renderer:
    if: github.repository == 'dimasma0305/zed'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      - name: Install the upstream Rust toolchain on the disposable runner
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy
      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        id: pdf-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: pdf-viewer-${{ runner.os }}-rust-1.98.1-${{ hashFiles('Cargo.lock') }}-renderer-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            pdf-viewer-${{ runner.os }}-rust-1.98.1-${{ hashFiles('Cargo.lock') }}-renderer-
            pdf-viewer-${{ runner.os }}-rust-1.98.1-${{ hashFiles('Cargo.lock') }}
            pdf-viewer-${{ runner.os }}-rust-1.98.1-
      - name: Check Rust formatting
        run: cargo fmt -p cli -p terminal -p pdf_renderer -p pdf_viewer -p zed -p remote -p remote_server -p project -p worktree -p workspace -p proto -p binary_viewer -p gpui_windows -p fs -p recent_projects -- --check
      - name: Test the renderer and worker protocol
        run: cargo test --locked -p pdf_renderer
      - name: Build the renderer worker probe
        run: cargo build --locked -p pdf_renderer --example worker
      - name: Check the real worker process and save rendered pages
        run: python3 crates/pdf_renderer/tests/check_worker.py target/debug/examples/worker pdf-renderer-qa
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pdf-renderer-qa
          path: pdf-renderer-qa
          retention-days: 7
      - name: Lint the renderer using the repository wrapper
        run: ./script/clippy -p pdf_renderer --locked
      - uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        if: ${{ !cancelled() && steps.pdf-cache.outputs.cache-hit != 'true' && steps.pdf-cache.outputs.cache-primary-key != '' }}
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.pdf-cache.outputs.cache-primary-key }}
  remote-server:
    if: github.repository == 'dimasma0305/zed'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      CC: clang
      CXX: clang++
      ZED_RELEASE_CHANNEL: stable
      RELEASE_CHANNEL: stable
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      - name: Install the upstream Rust toolchain on the disposable runner
        run: rustup toolchain install 1.98.1 --profile minimal
      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        id: remote-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: pdf-remote-linux-x86_64-rust-1.98.1-${{ hashFiles('Cargo.lock') }}-remote-server-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            pdf-remote-linux-x86_64-rust-1.98.1-${{ hashFiles('Cargo.lock') }}-remote-server-
            pdf-remote-linux-x86_64-rust-1.98.1-${{ hashFiles('Cargo.lock') }}
            pdf-remote-linux-x86_64-rust-1.98.1-
            pdf-viewer-Linux-rust-1.98.1-
      - name: Set up upstream Linux build dependencies on the disposable runner
        run: ./script/linux
      - name: Test remote terminal sockets and project updates
        run: cargo --config 'profile.dev.debug=0' --config 'profile.test.debug=0' test --locked -p remote_server --lib terminal_cli -j2
      - name: Test Linux atomic byte saves and file metadata
        run: cargo test --locked -p fs binary_edits::tests
      - name: Test remote bundle source, version, protocol and platform selection
        run: cargo test --locked -p remote --features bundled-remote-server transport::bundled_server::tests
      - name: Build the matching Linux server with production assertions
        run: cargo --config 'profile.release-fast.opt-level=3' --config 'profile.release-fast.debug=0' --config 'profile.release-fast.debug-assertions=false' --config 'profile.release-fast.strip="debuginfo"' build --locked --profile release-fast -p remote_server --bin remote-server --features remote_server/debug-embed
      - name: Test the remote terminal launcher process
        run: python3 script/check-remote-terminal-cli.py target/release-fast/remote-server
      - name: Validate runtime dependencies and exact server identity
        run: |
          ldd target/release-fast/remote-server | tee remote-server-dependencies.txt
          ! grep -q 'not found' remote-server-dependencies.txt
          python3 script/package-pdf-remote-server.py target/release-fast/remote-server pdf-remote-server --commit "$GITHUB_SHA"
          cp remote-server-dependencies.txt pdf-remote-server/
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pdf-zed-linux-remote-server
          path: pdf-remote-server
          retention-days: 7
          if-no-files-found: error
      - uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        if: ${{ !cancelled() && steps.remote-cache.outputs.cache-hit != 'true' && steps.remote-cache.outputs.cache-primary-key != '' }}
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.remote-cache.outputs.cache-primary-key }}
  windows:
    if: github.repository == 'dimasma0305/zed'
    runs-on: windows-2022
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      - name: Install the upstream Rust toolchain on the disposable runner
        run: rustup toolchain install 1.98.1 --profile minimal
      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        id: pdf-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: pdf-viewer-${{ runner.os }}-rust-1.98.1-${{ hashFiles('Cargo.lock') }}-windows-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            pdf-viewer-${{ runner.os }}-rust-1.98.1-${{ hashFiles('Cargo.lock') }}-windows-
            pdf-viewer-${{ runner.os }}-rust-1.98.1-${{ hashFiles('Cargo.lock') }}
            pdf-viewer-${{ runner.os }}-rust-1.98.1-
      - name: Check PDF viewer integration
        run: cargo check --locked -p pdf_viewer
      - name: Test current-folder CLI launch
        run: cargo test --locked -p cli --bin cli -- --test-threads=1
      - name: Test folders opened from remote terminals
        run: cargo test --locked -p remote_server --lib test_terminal_cli
      - name: Test terminal launches create sidebar projects
        run: cargo test --locked -p recent_projects test_terminal_cli
      - name: Test remote terminal launcher environment
        run: cargo test --locked -p project remote_cli_environment
      - name: Run PDF viewer GPUI tests
        run: cargo test --locked -p pdf_viewer
      - name: Run binary viewer and hex editor GPUI tests
        run: cargo test --locked -p binary_viewer
      - name: Test atomic byte saves and conflicts
        run: cargo test --locked -p fs binary_edits::tests
      - name: Test bounded file ranges and cancellation capacity
        run: cargo test --locked -p worktree --lib file_range_tests
      - name: Test SSH binary ranges, viewer navigation and disconnect cleanup
        run: cargo test --locked -p remote_server --lib test_remote_binary
      - name: Verify standalone account isolation
        run: cargo test --locked -p client --features settings/standalone test_standalone_rejects_account_login
      - name: Verify independent AI providers remain available
        run: cargo test --locked -p language_models --features settings/standalone test_standalone_keeps_independent_providers
      - name: Verify stale settings cannot restore account controls
        run: cargo test --locked -p title_bar --features settings/standalone test_standalone_hides_account_controls_despite_user_settings
      - name: Test the Windows cursor query fallback
        run: cargo test --locked -p gpui_windows --features test-support cursor_position_tests
      - name: Test Windows bundled-server upload paths and identity checks
        run: cargo test --locked -p remote --features bundled-remote-server transport::bundled_server::tests
      - name: Test bounded in-memory file transfers
        run: cargo test --locked -p project bounded_file::tests
      - name: Test SSH PDF transfer, viewer navigation, errors and cleanup
        run: cargo test --locked -p remote_server test_remote_pdf
      - name: Check the Zed application
        run: cargo check --locked -p zed
      - name: Generate dependency license notices
        run: ./script/generate-licenses.ps1
      - name: Build the optimized Windows release
        env:
          ZED_RELEASE_CHANNEL: stable
          RELEASE_CHANNEL: stable
          ZED_UPDATE_EXPLANATION: Download updates for this PDF viewer fork from https://github.com/dimasma0305/zed/releases. Upstream automatic updates are disabled for this build.
        run: cargo --config 'profile.release-fast.opt-level=3' --config 'profile.release-fast.debug=0' --config 'profile.release-fast.debug-assertions=false' build --locked --profile release-fast -p zed -p cli --bin zed --bin cli --features util/debug-embed,remote/bundled-remote-server
      - name: Check the PDF helper inside the Windows application
        run: python crates/pdf_renderer/tests/check_worker.py target/release-fast/zed.exe pdf-windows-qa
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pdf-windows-qa
          path: pdf-windows-qa
          retention-days: 7
      - name: Collect the optimized Windows release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path pdf-zed-windows -Force
          Copy-Item -LiteralPath target/release-fast/zed.exe -Destination pdf-zed-windows
          Copy-Item -LiteralPath target/release-fast/cli.exe -Destination pdf-zed-windows
          Copy-Item -LiteralPath target/release-fast/conpty.dll -Destination pdf-zed-windows
          Copy-Item -LiteralPath target/release-fast/OpenConsole.exe -Destination pdf-zed-windows
          Copy-Item -LiteralPath LICENSE-GPL -Destination pdf-zed-windows
          Copy-Item -LiteralPath assets/licenses.md -Destination pdf-zed-windows
          Copy-Item -LiteralPath docs/src/pdf-viewer.md -Destination pdf-zed-windows
          Copy-Item -LiteralPath docs/src/binary-viewer.md -Destination pdf-zed-windows
          git rev-parse HEAD | Set-Content -Path pdf-zed-windows/commit.txt
          Get-FileHash -Algorithm SHA256 pdf-zed-windows/zed.exe | Format-List | Out-File pdf-zed-windows/sha256.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pdf-zed-windows-release
          path: pdf-zed-windows
          retention-days: 7
          if-no-files-found: error
      - uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        if: ${{ !cancelled() && steps.pdf-cache.outputs.cache-hit != 'true' && steps.pdf-cache.outputs.cache-primary-key != '' }}
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.pdf-cache.outputs.cache-primary-key }}
